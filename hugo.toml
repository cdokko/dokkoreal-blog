# Site settings for blog.dokkoreal.com (Hugo 0.169.0, theme Nuno v0.3.0).
# Every key under [params] is a Nuno setting; its own docs are in
# themes/nuno/README.md.

baseURL = "https://blog.dokkoreal.com/"
locale = "en-us"
title = "Christopher Dokko-Real"
theme = "nuno"

enableRobotsTXT = true

# Post URLs are /<slug>/, so post 1 lives at /photos-post-it-notes-box/
[permalinks]
  posts = "/:slug/"

# RSS for subscribers; JSON is the index Nuno's search box reads.
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.parser.attribute]
    # Lets a paragraph carry a class, e.g. {.refrain} under the refrain line
    block = true
  [markup.goldmark.extensions.typographer]
    # Keep quotes and dashes exactly as written; no automatic curly quotes
    disable = true

[params]
  # --- look ---
  ground = "brown"          # brown | green
  defaultTheme = "auto"     # auto follows the reader's device; dark | light
  # accent = "#e8b04b"      # dark-mode accent colour (Nuno's default)

  # --- identity ---
  brand = "Dokko-Real"       # the name in the top-left of the nav
  masthead = "but why not, tho"
  tagline = "building,\nsystems,\nthinking,\n& finding out"   # \n = line break (custom.css keeps them)
  description = "ideas on datawork and the human experience by christopher dokko-real"   # search results and home link previews
  copyright = "© 2026 Christopher Dokko-Real"

  # --- icons and link previews ---
  # favicon: assets/favicon.ico is picked up automatically (16, 32, 48 px inside)
  appleTouchIcon = "apple-touch-icon.png"   # static/, 180x180, iPhone home screen
  # Absolute URL so the PNG is served as-is; Nuno would otherwise convert it to WebP,
  # which not every app shows in previews. Only resolves once the site is live.
  ogImage = "https://blog.dokkoreal.com/images/og.png"

  # --- About page (/about/, Nuno's About layout) ---
  # Heading: each span is one stacked line on desktop; they run together on phones.
  # The "accent" class colours that line in the accent.
  aboutHeading = '<span class="about__title-part">Data nerd.</span> <span class="about__title-part">Policy researcher.</span> <span class="about__title-part accent">Tinkerer.</span>'
  portrait = "images/portrait.jpg"   # assets/; metadata stripped before commit. Icons under it come from socialIcons

  # --- home page ---
  homeHeader = "masthead"
  homeStyle = "ledger"      # a list that works for any number of posts
  mainSections = ["posts"]
  DateFormat = "2 January 2006"

  [params.author]
    name = "Christopher Dokko-Real"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:christopher@dokkoreal.com"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Writing"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"     # Nuno keeps the "about" entry in the nav on phones
    name = "About"
    url = "/about/"
    weight = 20
